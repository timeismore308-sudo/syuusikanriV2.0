<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>クラスの収入管理 2.0</title>


<style>

/* ========================================
   基本設定
======================================== */

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;

  background:#f5f6f8;

  color:#222;
}

button,
input{

  font-family:inherit;
}


/* ========================================
   全体
======================================== */

.container{

  width:min(
    1100px,
    calc(100% - 32px)
  );

  margin:auto;

  padding:
    28px 0
    48px;
}

h1{

  margin:
    0 0 24px;

  font-size:
    clamp(
      26px,
      4vw,
      38px
    );
}

h2{

  margin:
    0 0 18px;

  font-size:20px;
}


/* ========================================
   グリッド
======================================== */

.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:18px;
}

.full{

  grid-column:
    1 / -1;
}


/* ========================================
   カード
======================================== */

.card{

  background:#fff;

  border-radius:16px;

  padding:20px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.07);
}


/* ========================================
   入力欄
======================================== */

.field{

  margin-bottom:16px;
}

label{

  display:block;

  margin-bottom:8px;

  font-weight:700;
}

.unit{

  display:flex;

  align-items:center;

  gap:8px;
}

.unit input{

  flex:1;
}

input{

  width:100%;

  min-height:52px;

  padding:
    10px 14px;

  border:
    1px solid
    #cfd3d8;

  border-radius:10px;

  background:#fff;

  font-size:20px;
}

input:focus{

  outline:none;

  border-color:#222;

  box-shadow:
    0 0 0 3px
    rgba(0,0,0,.08);
}

.unit span{

  font-size:18px;

  font-weight:600;

  white-space:nowrap;
}


/* ========================================
   現在の収益
======================================== */

.results{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.result{

  padding:18px;

  border-radius:12px;

  background:#f0f2f5;
}

.name{

  font-size:15px;

  color:#555;

  font-weight:700;
}

.value{

  margin-top:6px;

  font-size:
    clamp(
      24px,
      4vw,
      34px
    );

  font-weight:800;
}


/* ========================================
   補助結果表示
======================================== */

.sub-result{

  margin-top:12px;

  padding:14px;

  background:#fafafa;

  border:
    1px solid
    #e5e5e5;

  border-radius:10px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;
}

.sub-result .label{

  margin:0;

  color:#555;

  font-weight:700;
}

.sub-result .amount{

  font-size:18px;

  font-weight:800;
}


/* ========================================
   前売り券売上表示
======================================== */

.ticket-revenue{

  margin-top:12px;

  padding:
    12px 14px;

  background:#f5f6f8;

  border-radius:10px;

  color:#555;

  font-size:14px;

  line-height:1.6;
}

.ticket-revenue strong{

  color:#222;
}


/* ========================================
   入場料金設定
======================================== */

.price-setting{

  display:grid;

  grid-template-columns:
    1fr auto auto;

  gap:8px;

  align-items:end;
}

.price-setting .field{

  margin-bottom:0;
}

.small-button{

  width:auto;

  min-width:90px;

  min-height:52px;

  padding:
    0 16px;

  border:0;

  border-radius:10px;

  font-size:17px;

  font-weight:800;

  cursor:pointer;
}

.add-price{

  background:#222;

  color:#fff;
}

.add-price:hover{

  background:#000;
}

.remove-price{

  background:#e8eaed;

  color:#222;
}

.remove-price:hover{

  background:#dcdfe3;
}


/* ========================================
   登録料金一覧
======================================== */

.price-list{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(120px,1fr)
    );

  gap:10px;

  margin-top:18px;
}

.price-button{

  min-height:64px;

  padding:
    10px;

  border:
    2px solid
    #d9dce0;

  border-radius:12px;

  background:#fff;

  color:#222;

  font-size:20px;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .1s,
    background .15s,
    border-color .15s;
}

.price-button:hover{

  background:#f5f6f8;
}

.price-button:active{

  transform:scale(.97);
}

.price-button.selected{

  border-color:#222;

  background:#222;

  color:#fff;
}


/* ========================================
   現在の入場入力
======================================== */

.current-entry{

  margin-top:20px;

  padding:18px;

  border-radius:12px;

  background:#f5f6f8;

  text-align:center;
}

.current-entry-label{

  color:#666;

  font-size:15px;

  font-weight:700;
}

.current-entry-value{

  margin-top:6px;

  font-size:
    clamp(
      28px,
      6vw,
      42px
    );

  font-weight:900;
}

.current-entry-note{

  margin-top:6px;

  color:#777;

  font-size:14px;
}


/* ========================================
   入場ボタン
======================================== */

.entry-button{

  margin-top:14px;

  background:#222;

  color:#fff;
}

.entry-button:hover{

  background:#000;
}


/* ========================================
   注意・エラー
======================================== */

.note{

  margin-top:8px;

  color:#666;

  font-size:14px;

  line-height:1.6;
}

.error{

  margin-top:12px;

  color:#c62828;

  font-weight:700;

  text-align:center;
}


/* ========================================
   履歴
======================================== */

.history-wrapper{

  width:100%;

  overflow-x:auto;
}

.history{

  width:100%;

  border-collapse:collapse;

  min-width:520px;
}

.history th,
.history td{

  padding:
    11px 10px;

  border-bottom:
    1px solid
    #e2e4e7;

  text-align:right;
}

.history th:first-child,
.history td:first-child{

  text-align:center;
}

.history th{

  color:#555;

  font-size:14px;
}

.empty{

  color:#777;

  text-align:center!important;

  padding:
    20px!important;
}


/* ========================================
   リセット
======================================== */

.reset{

  margin-top:20px;

  background:#e8eaed;

  color:#222;
}

.reset:hover{

  background:#dcdfe3;
}


/* ========================================
   スマホ対応
======================================== */

@media(max-width:700px){

  .container{

    width:
      min(
        100% - 20px,
        600px
      );

    padding-top:18px;

    padding-bottom:32px;
  }

  .grid{

    grid-template-columns:1fr;
  }

  .full{

    grid-column:auto;
  }

  .results{

    grid-template-columns:1fr;
  }

  .card{

    padding:16px;

    border-radius:14px;
  }

  h1{

    margin-bottom:18px;
  }

  .price-setting{

    grid-template-columns:1fr 1fr;
  }

  .price-setting .field{

    grid-column:
      1 / -1;
  }

  .small-button{

    width:100%;
  }

  .price-list{

    grid-template-columns:
      repeat(2,1fr);
  }

  .value{

    font-size:30px;
  }

}


/* ========================================
   さらに小さい画面
======================================== */

@media(max-width:380px){

  .price-list{

    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<div class="container">

  <h1>クラスの収入管理 2.0</h1>


  <div class="grid">


    <!-- ====================================
         前提条件
    ===================================== -->

    <section class="card">

      <h2>前提条件</h2>


      <!-- 資金 -->

      <div class="field">

        <label for="funds">
          資金
        </label>

        <div class="unit">

          <input
            id="funds"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          >

          <span>円</span>

        </div>

      </div>


      <!-- 消費 -->

      <div class="field">

        <label for="cost">
          消費
        </label>

        <div class="unit">

          <input
            id="cost"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          >

          <span>円</span>

        </div>

      </div>


      <!-- 前売り券料金 -->

      <div class="field">

        <label for="advanceTicketPrice">
          前売り券の料金
        </label>

        <div class="unit">

          <input
            id="advanceTicketPrice"
            type="number"
            min="0"
            step="1"
            placeholder="100"
          >

          <span>円 / 枚</span>

        </div>

      </div>


      <!-- 前売り券販売数 -->

      <div class="field">

        <label for="advanceTickets">
          前売り券の販売数
        </label>

        <div class="unit">

          <input
            id="advanceTickets"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          >

          <span>枚</span>

        </div>

      </div>


      <!-- 前売り券売上 -->

      <div class="ticket-revenue">

        前売り券売上：

        <strong id="advanceRevenue">
          0 円
        </strong>

      </div>


      <div class="note">

        前売り券売上は
        「前売り券の料金 × 販売数」
        で内部計算されます。

      </div>

    </section>



    <!-- ====================================
         現在の収益
    ===================================== -->

    <section class="card">

      <h2>現在の収益</h2>


      <div class="results">


        <!-- 入場者数 -->

        <div class="result">

          <div class="name">
            入場者数
          </div>

          <div
            id="totalVisitors"
            class="value"
          >
            0 人
          </div>

        </div>


        <!-- 売上 -->

        <div class="result">

          <div class="name">
            売上
          </div>

          <div
            id="earnings"
            class="value"
          >
            0 円
          </div>

        </div>


        <!-- 総収入 -->

        <div class="result">

          <div class="name">
            総収入
          </div>

          <div
            id="profit"
            class="value"
          >
            0 円
          </div>

        </div>


      </div>


    </section>



    <!-- ====================================
         入力対応
    ===================================== -->

    <section class="card full">

      <h2>入力対応</h2>


      <!-- 入場料金の追加・削減 -->

      <div class="price-setting">


        <div class="field">

          <label for="priceSettingInput">
            入場料金設定
          </label>

          <div class="unit">

            <input
              id="priceSettingInput"
              type="number"
              min="1"
              step="1"
              placeholder="例：200"
            >

            <span>円</span>

          </div>

        </div>


        <button
          id="addPriceButton"
          class="small-button add-price"
        >
          追加
        </button>


        <button
          id="removePriceButton"
          class="small-button remove-price"
        >
          削減
        </button>


      </div>


      <div class="note">

        入場料金を入力して「追加」を押すと、
        その料金のボタンが作成されます。
        削除したい料金を入力して「削減」を押してください。

      </div>


      <div
        id="priceError"
        class="error"
      >
      </div>


      <!-- 入場料金ボタン -->

      <div
        id="priceList"
        class="price-list"
      >
      </div>


      <!-- 現在の入力状態 -->

      <div class="current-entry">

        <div class="current-entry-label">
          現在の入場入力
        </div>

        <div
          id="currentEntryValue"
          class="current-entry-value"
        >
          料金未選択・0人
        </div>

        <div class="current-entry-note">
          料金ボタンを押すと人数が1人ずつ増えます。
        </div>

      </div>


      <!-- 入場 -->

      <button
        id="entryButton"
        class="entry-button"
      >
        入場
      </button>


      <div
        id="entryError"
        class="error"
      >
      </div>


    </section>



    <!-- ====================================
         入場者数の履歴
    ===================================== -->

    <section class="card full">

      <h2>入場者数の履歴</h2>


      <div class="history-wrapper">

        <table class="history">

          <thead>

            <tr>

              <th>回</th>

              <th>入場料金</th>

              <th>入場者数</th>

              <th>売上</th>

              <th>売上累計</th>

            </tr>

          </thead>


          <tbody id="historyBody">

            <tr>

              <td
                colspan="5"
                class="empty"
              >
                まだ入力されていません
              </td>

            </tr>

          </tbody>

        </table>

      </div>


      <!-- クラス費 -->

      <div class="sub-result">

        <div class="label">
          クラス費
        </div>

        <div
          id="classFee"
          class="amount"
        >
          0 円
        </div>

      </div>


      <!-- リセット -->

      <button
        id="resetButton"
        class="reset"
      >
        すべてリセット
      </button>


    </section>


  </div>

</div>



<script>


/* ==================================================
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   ★
   ★  基本設定
   ★
   ★  後から変更する可能性がある数値
   ★  はここにまとめています。
   ★
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
================================================== */


/*
 * ================================================
 * 前売り券の初期料金
 * ================================================
 *
 * サイトを初めて使用したときに
 * 前売り券の料金欄へ入れる初期値です。
 *
 * 例：
 * 100 → 100円 / 枚
 *
 * 実際の料金に合わせて変更してください。
 */

const DEFAULT_ADVANCE_TICKET_PRICE = 100;


/*
 * ================================================
 * クラス費の判定基準
 * ================================================
 *
 * CLASS_FEE_THRESHOLD
 *
 * 利潤がこの金額以上なら
 * 「利潤 - CLASS_FEE_DEDUCTION」
 * でクラス費を計算します。
 *
 * 現在の設定：
 * 40,000円
 */

const CLASS_FEE_THRESHOLD = 40000;


/*
 * ================================================
 * クラス費の控除額
 * ================================================
 *
 * 利潤が40,000円以上の場合、
 *
 * 利潤 - 20,000円
 *
 * とするための20,000円です。
 */

const CLASS_FEE_DEDUCTION = 20000;


/* ==================================================
   設定ここまで
================================================== */



/* ==================================================
   HTML要素取得
================================================== */

const $ = id =>
  document.getElementById(id);



/* ==================================================
   保存データ
================================================== */

/*
 * このサイト専用の保存場所です。
 *
 * 旧サイトの
 * visitorRevenueState
 * とは別にしています。
 *
 * そのため旧サイトの
 * 「price」「entries」などの構造が
 * 2.0のデータ構造に混ざりません。
 */

const STORAGE_KEY =
  "visitorRevenueStateV2";


/*
 * ================================================
 * state のデータ構造
 * ================================================
 *
 * funds
 *   現在使える資金
 *
 * cost
 *   消費した金額
 *
 * advanceTicketPrice
 *   前売り券1枚あたりの料金
 *
 * advanceTickets
 *   販売した前売り券の枚数
 *
 * entryPrices
 *   現在使用可能な入場料金一覧
 *
 * currentPrice
 *   現在選択中の入場料金
 *
 * currentVisitors
 *   現在選択中の料金で
 *   「入場」をまだ確定していない人数
 *
 * entries
 *   「入場」を押して確定した履歴
 *
 * entriesの1件は
 *
 * {
 *   price: 入場料金,
 *   visitors: 入場者数
 * }
 *
 * という形で保存されます。
 *
 * 例：
 *
 * [
 *   {
 *     price: 200,
 *     visitors: 2
 *   },
 *   {
 *     price: 300,
 *     visitors: 5
 *   }
 * ]
 *
 * なら、
 *
 * 200円で2人
 * 300円で5人
 *
 * が別々の履歴として保存されています。
 */

const defaultState = {

  funds: 0,

  cost: 0,

  advanceTicketPrice:
    DEFAULT_ADVANCE_TICKET_PRICE,

  advanceTickets: 0,

  entryPrices: [],

  currentPrice: null,

  currentVisitors: 0,

  entries: []

};



/* ==================================================
   保存データ読み込み
================================================== */

/*
 * localStorageに保存されているデータを
 * 読み込みます。
 *
 * 保存データが壊れていた場合でも
 * サイト全体が停止しないようにしています。
 */

function loadState(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!saved){

      return {
        ...defaultState
      };

    }


    const parsed =
      JSON.parse(saved);


    return {

      ...defaultState,

      ...parsed,

      entryPrices:
        Array.isArray(parsed.entryPrices)
          ? parsed.entryPrices
          : [],

      entries:
        Array.isArray(parsed.entries)
          ? parsed.entries
          : []

    };

  }catch(error){

    return {
      ...defaultState
    };

  }

}


const state =
  loadState();



/* ==================================================
   データ保存
================================================== */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}



/* ==================================================
   金額表示
================================================== */

function money(value){

  return (
    Math.round(value)
      .toLocaleString("ja-JP")
    + " 円"
  );

}



/* ==================================================
   数値の安全化
================================================== */

/*
 * 入力値が不正な場合でも
 * 計算結果がNaNにならないようにします。
 */

function safeNumber(value){

  const number =
    Number(value);

  return Number.isFinite(number)
    ? number
    : 0;

}



/* ==================================================
   前売り券売上
================================================== */

/*
 * 前売り券売上 =
 *
 * 前売り券料金
 * ×
 * 前売り券販売数
 */

function getAdvanceRevenue(){

  return (
    safeNumber(
      state.advanceTicketPrice
    )
    *
    safeNumber(
      state.advanceTickets
    )
  );

}



/* ==================================================
   入場者数合計
================================================== */

/*
 * 過去に「入場」を押して
 * 確定した人数だけを合計します。
 *
 * 現在入力中の人数は、
 * まだ「入場」を押していないため
 * ここには含めません。
 */

function getTotalVisitors(){

  return state.entries.reduce(
    (total, entry) => {

      return (
        total
        +
        safeNumber(entry.visitors)
      );

    },
    0
  );

}



/* ==================================================
   入場による売上
================================================== */

/*
 * ここが今回のサイトで最も重要な
 * 売上計算部分です。
 *
 *
 * 各履歴について
 *
 * 入場料金 × その料金で来た人数
 *
 * を計算し、
 * 全履歴を合計します。
 *
 *
 * 例：
 *
 * 200円 × 2人 = 400円
 * 300円 × 5人 = 1500円
 * 200円 × 3人 = 600円
 *
 * 入場売上 =
 *
 * 400
 * +1500
 * +600
 *
 * =2500円
 */

function getEntryRevenue(){

  return state.entries.reduce(
    (total, entry) => {

      const price =
        safeNumber(
          entry.price
        );

      const visitors =
        safeNumber(
          entry.visitors
        );

      return (
        total
        +
        price * visitors
      );

    },
    0
  );

}



/* ==================================================
   総売上
================================================== */

/*
 * 総売上ではなく、
 * このサイトで表示する「売上」です。
 *
 * 売上 =
 *
 * 入場による売上
 * +
 * 前売り券売上
 */

function getEarnings(){

  return (
    getEntryRevenue()
    +
    getAdvanceRevenue()
  );

}



/* ==================================================
   利潤
================================================== */

/*
 * 旧サイトから引き継いだ計算式。
 *
 * 利潤 =
 *
 * 資金
 * -
 * 消費
 * +
 * 稼ぎ
 *
 * 今回は「稼ぎ」を
 * 現在の売上として扱います。
 */

function getProfit(){

  return (
    safeNumber(state.funds)
    -
    safeNumber(state.cost)
    +
    getEarnings()
  );

}



/* ==================================================
   クラス費
================================================== */

/*
 * 利潤が40,000円以上
 *
 * → 利潤 - 20,000円
 *
 *
 * 利潤が40,000円未満
 *
 * → 利潤 ÷ 2
 *
 * → 小数点以下切り捨て
 */

function getClassFee(){

  const profit =
    getProfit();


  if(
    profit >=
    CLASS_FEE_THRESHOLD
  ){

    return (
      profit
      -
      CLASS_FEE_DEDUCTION
    );

  }


  return Math.floor(
    profit / 2
  );

}
